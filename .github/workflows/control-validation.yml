name: Control local validation
on:
  push:
    branches: ['feat/artex-control-v1-1', 'feat/artex-control-v1-1-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ARTEX_PG_DSN: postgres://control_test@localhost:5432/artex_research_test_control_ci
      ARTEX_TEST_PG_DSN: postgres://control_test@localhost:5432/artex_research_test_control_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Create disposable unprivileged database owner
        run: |
          psql -X -w -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE control_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE;'
          psql -X -w -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE artex_research_test_control_ci OWNER control_test;'
      - name: Resolve pinned public modules
        run: go mod download && go mod verify
      - name: Aggregate mandatory and affected regression gates
        run: python3 scripts/test-control-eng00.py "$RUNNER_TEMP/control-receipts" all
      - name: Build and vet
        run: go build ./... && go vet ./control ./execution ./db ./agent ./server ./report
      - name: Existing frontend checks
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run check && npm run build
      - name: Keep raw test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-receipts/
          if-no-files-found: error
          retention-days: 7
