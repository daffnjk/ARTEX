name: Research harness

on:
  pull_request:
    paths:
      - 'harness/**'
      - 'cmd/harness-eval/**'
      - 'agent/**'
      - 'db/**'
      - 'server/task_llm.go'
      - 'scripts/ci-export-research-sdk.sh'
      - 'scripts/ci-export-research-postgres.sh'
      - 'scripts/test-harness-offline.sh'
      - 'scripts/test-research-pg.sh'
      - 'docs/autopilot/**'
      - 'docs/research-harness/**'
      - '.github/workflows/research-harness.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: ['research/evidence-harness-m1']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5, pinned
        with:
          go-version: '1.23.2'
          cache: false
      - name: Record exact source and toolchain (no environment or credentials)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/research-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/research-evidence/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/research-evidence/source-tree.txt"
          git bundle create "$RUNNER_TEMP/research-evidence/source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/research-evidence/source.bundle"
          go version > "$RUNNER_TEMP/research-evidence/toolchain.txt"
      - name: Offline core tests with failure-preserving log
        shell: bash
        run: sh scripts/test-harness-offline.sh 2>&1 | tee "$RUNNER_TEMP/research-evidence/offline-core.log"
      - name: Retain exact-source and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned
        with:
          name: research-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-evidence/
          if-no-files-found: error
          retention-days: 3

  agent-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5, pinned
        with:
          go-version-file: go.mod
          cache: true
      - name: Core under project toolchain
        run: go test -race -count=1 ./harness ./cmd/harness-eval
        env:
          GOFLAGS: -mod=readonly
      - name: Completion gate integration (no target or database)
        run: go test -count=1 -run '^TestGoalCompletion' ./agent
        env:
          GOFLAGS: -mod=readonly
      - name: One-shot real toolchain and dependency acquisition
        if: ${{ hashFiles('docs/autopilot/sdk-export-request.txt') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: sh scripts/ci-export-research-sdk.sh
        env:
          GOFLAGS: -mod=readonly
      - name: Retain bounded public SDK archive
        if: ${{ success() && hashFiles('docs/autopilot/sdk-export-request.txt') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned
        with:
          name: research-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-sdk-export/
          if-no-files-found: error
          retention-days: 1
      - name: One-shot isolated PostgreSQL image acquisition
        if: ${{ hashFiles('docs/autopilot/pg-export-request.txt') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: sh scripts/ci-export-research-postgres.sh
      - name: Retain bounded public PostgreSQL image
        if: ${{ success() && hashFiles('docs/autopilot/pg-export-request.txt') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f3607fa02 # v4, pinned
        with:
          name: research-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-pg-export/
          if-no-files-found: error
          retention-days: 1

  # M1b.1c: real isolated PostgreSQL matrix for task-plan persistence (CAS,
  # recovery, delete/archive, error surfacing). Ephemeral service container; the
  # runner script itself rejects missing DSN and any non-local /
  # non-artex_research_test target, and the suite never silently skips.
  research-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: artex_research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d artex_research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af67726e # v4, pinned
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5, pinned
        with:
          go-version-file: go.mod
          cache: true
      - name: Isolated PG matrix (task plans CAS/recovery/archive)
        run: sh scripts/test-research-pg.sh 2>&1 | tee "$RUNNER_TEMP/research-pg-matrix.log"
        env:
          ARTEX_TEST_PG_DSN: postgres://research:research@localhost:5432/artex_research_test
          GOFLAGS: -mod=readonly
      - name: Retain PG matrix log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f3607fa02 # v4, pinned
        with:
          name: research-pg-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-pg-matrix.log
          if-no-files-found: error
          retention-days: 3
